[project]
name = "ndnf-pipeline"
version = "0.1.0"
description = "Shared DataJoint pipeline for the Neuronal Diversity in Network Function lab"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "datajoint>=0.14.6",
    "google-api-python-client>=2.187.0",
    "graphviz>=0.21",
    "gspread>=6.2.1",
    "harp-python>=0.4.1",
    "holoviews>=1.23.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.8",
    "notebook>=7.6.0",
    "oauth2client>=4.1.3",
    "opencv-python>=4.13.0.92",
    "panel>=1.9.3",
    "pip>=26.1.2",
    "pydotplus>=2.0.2",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {where = ["."], exclude = ["Notebooks*", "scripts*", "tests*"]}
